name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mivo-Server
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mivo
          POSTGRES_PASSWORD: mivo
          POSTGRES_DB: mivo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mivo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://mivo:mivo@localhost:5432/mivo_test
      DATABASE_URL_SYNC: postgresql+psycopg://mivo:mivo@localhost:5432/mivo_test
      # Public test-only values (tests/conftest.py), accepted only with APP_ENV=test;
      # alembic loads the settings outside pytest.
      JWT_SECRET: test-jwt-secret-that-is-long-enough-0123456789
      FERNET_KEY: yQ2Ky0-PWXVYd5o1S4cTL8C2n0Wf7tT7xmFJwlm3i-8=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Models match the migrations
        run: uv run alembic check

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mivo-Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mivo-Client/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run generate
